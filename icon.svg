<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#faf7f2"/>
  <!-- 4 strings -->
  <line x1="140" y1="130" x2="140" y2="380" stroke="#c9622f" stroke-width="6"/>
  <line x1="220" y1="130" x2="220" y2="380" stroke="#c9622f" stroke-width="6"/>
  <line x1="300" y1="130" x2="300" y2="380" stroke="#c9622f" stroke-width="6"/>
  <line x1="380" y1="130" x2="380" y2="380" stroke="#c9622f" stroke-width="6"/>
  <!-- top nut -->
  <line x1="120" y1="130" x2="400" y2="130" stroke="#c9622f" stroke-width="10"/>
  <!-- fret lines -->
  <line x1="120" y1="195" x2="400" y2="195" stroke="#e5ddd0" stroke-width="5"/>
  <line x1="120" y1="260" x2="400" y2="260" stroke="#e5ddd0" stroke-width="5"/>
  <line x1="120" y1="325" x2="400" y2="325" stroke="#e5ddd0" stroke-width="5"/>
  <!-- finger dots on frets -->
  <circle cx="180" cy="162" r="22" fill="#c9622f"/>
  <circle cx="260" cy="227" r="22" fill="#c9622f"/>
  <circle cx="340" cy="162" r="22" fill="#c9622f"/>
  <circle cx="300" cy="292" r="22" fill="#c9622f"/>
  <circle cx="380" cy="292" r="22" fill="#c9622f"/>
</svg>
