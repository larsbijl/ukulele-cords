<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baritone Uke Chord Charts</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" sizes="any" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="vendor/svguitar.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
</head>
<body>
  <header>
<div id="tuning-control">
      <label>Tuning:
        <select id="tuning-selector">
          <option value="baritone">Baritone (D G B E)</option>
          <option value="standard">Standard (G C E A)</option>
        </select>
      </label>
      <span id="tuning-label"></span>
    </div>
    <div id="song-info"></div>
    <div id="finger-legend"></div>
    <div id="header-menu">
      <button id="menu-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </button>
      <div id="menu-dropdown" hidden>
        <button id="menu-add-chord">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add chord
        </button>
        <a id="menu-get-shortcut" href="#" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10"/></svg>
          Get Shortcut
        </a>
      </div>
    </div>
  </header>

  <div id="chord-modal" class="modal-overlay" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="Add chord">
      <h2>Add chord</h2>
      <input id="chord-input" type="text" placeholder="e.g. Am, G7, Cmaj7"
        list="chord-suggestions" autocomplete="off" autocorrect="off"
        autocapitalize="characters" spellcheck="false">
      <datalist id="chord-suggestions"></datalist>
      <div class="modal-actions">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-add" class="btn-primary">Add</button>
      </div>
    </div>
  </div>

  <a id="fab-camera" href="#" aria-label="Take photo" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
  </a>

  <div id="chord-grid"></div>

  <script src="app.js"></script>
  <script>navigator.serviceWorker?.register('sw.js')</script>
</body>
</html>
